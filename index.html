<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Binance Spot Tarayıcı Pro</title>
<style>
:root{--bg:#071225;--text:#f1f6ff;--muted:#b6c7e2;--green:#00e0a4;--red:#ff5577;--yellow:#ffd166}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#0a1c38 0,#050d1c 65%);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:18px}
.wrap{max-width:1500px;margin:auto}
.brand{font-size:27px;font-weight:900;color:#39a6ff}
.subcode{color:#a8c9f4;margin:0 0 20px}
.hero{border:1px solid #244c7d;background:linear-gradient(120deg,#091b36,#0a1427);border-radius:13px;padding:18px 20px;max-width:640px;margin-bottom:16px}
.hero h1{margin:0;font-size:28px;line-height:1.2}.hero h1 span{color:var(--green)}
.hero p{margin:10px 0 0;color:var(--muted);border-top:1px solid #426080;padding-top:10px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 10px}
button,input,select{border:1px solid #2b4b76;border-radius:9px;padding:11px 13px;background:#0b1c36;color:var(--text);font:inherit}
button{cursor:pointer;font-weight:700}button:disabled{opacity:.5;cursor:wait}
button.primary{background:#00a982;border-color:#00e0a4;color:#041b1b}
input{min-width:210px;flex:1}
.status{color:var(--muted);font-size:12px;margin:10px 0 18px}.status b{color:var(--green)}.status .w{color:var(--yellow)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat,.panel{background:linear-gradient(145deg,#0c1c32,#08162b);border:1px solid #203b61;border-radius:12px}
.stat{padding:15px 17px}.stat .label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:24px;margin-top:4px}
.green{color:var(--green)!important}.red{color:var(--red)!important}.yellow{color:var(--yellow)!important}
.panel{padding:15px;margin:16px 0}.panel h2{margin:0 0 5px;font-size:21px}.hint{color:var(--muted);margin:0 0 12px}
.tablewrap{overflow:auto;max-height:620px;border:1px solid #1d385c;border-radius:9px}
table{width:100%;border-collapse:collapse;min-width:850px;background:#07162b}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid #1c3556;white-space:nowrap;font-size:12px}
th{position:sticky;top:0;background:#102442;color:#dbeaff;z-index:2}
